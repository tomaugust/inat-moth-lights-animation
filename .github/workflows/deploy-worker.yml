name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - worker/**
      - src/inaturalist-client.js
      - src/observation-adapter.js
      - package.json
      - package-lock.json
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read

# Scoped by ref so a manual workflow_dispatch test run on some branch never
# queues behind (or blocks) a real push-triggered deploy from main, or vice
# versa — only re-triggers of the *same* ref serialize against each other.
concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Bounded well under GitHub's 360-minute default so a hung wrangler
    # deploy or a hung curl can't wedge this ref's concurrency group closed
    # for hours with nothing able to recover it.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials are configured
        id: check-secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.check-secrets.outputs.configured == 'true'
        run: npm ci

      - name: Deploy Worker
        id: deploy
        if: steps.check-secrets.outputs.configured == 'true'
        working-directory: worker
        run: |
          set -o pipefail
          npx wrangler deploy | tee deploy-output.txt
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy-output.txt | head -1)
          if [ -z "$url" ]; then
            echo "::error::Could not find the deployed Worker's URL in wrangler's output."
            exit 1
          fi
          echo "worker_url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify the deployed Worker answers with a valid, non-empty contract
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          url="${{ steps.deploy.outputs.worker_url }}/observations"
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            echo "Attempt $attempt/$attempts: checking $url"
            status=$(curl -sS --max-time 15 "$url" -o response.json -w '%{http_code}') || true
            echo "HTTP status: ${status:-<request failed>}"
            cat response.json 2>/dev/null || echo "(no response body)"
            echo
            # A stale/empty fallback (the Worker's own documented behavior
            # when it can't reach iNaturalist) is valid JSON with an
            # observations array, so checking for that alone would let a
            # Worker that can *never* reach upstream report "verified"
            # forever. Require a fresh, non-empty response instead, and
            # retry a couple of times first in case this is just an ordinary
            # transient upstream hiccup right after a cold deploy (exactly
            # what happened the first time this workflow ran for real).
            if node -e '
              const data = JSON.parse(require("fs").readFileSync("response.json", "utf8"));
              if (!Array.isArray(data.observations)) {
                console.error("Response is missing an observations array:", data);
                process.exit(1);
              }
              console.log(`observations=${data.observations.length} stale=${data.stale} error=${data.error}`);
              if (data.stale !== false || data.observations.length === 0) {
                process.exit(2);
              }
            '; then
              echo "Verified: got a fresh, non-empty contract."
              exit 0
            fi
            echo "Not a healthy response yet."
            if [ "$attempt" -lt "$attempts" ]; then
              echo "Retrying in 5s..."
              sleep 5
            fi
          done
          echo "::error::The Worker never returned a fresh, non-empty observations contract after $attempts attempts — it may be unable to reach iNaturalist upstream. Check the deploy logs and worker/src/index.js's fetchUpstream."
          exit 1

      - name: Skip (credentials not configured)
        if: steps.check-secrets.outputs.configured == 'false'
        run: |
          echo "::warning::Skipping Cloudflare Worker deploy — the CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repository secrets are not set. Add both under Settings > Secrets and variables > Actions to enable this workflow (see README.md)."
