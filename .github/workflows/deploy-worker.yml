name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
      - claude/repository-review-iok690 # TEMP: verifying the deploy before opening the PR; remove before merge
    paths:
      - worker/**
      - src/inaturalist-client.js
      - src/observation-adapter.js
      - package.json
      - package-lock.json
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials are configured
        id: check-secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.check-secrets.outputs.configured == 'true'
        run: npm ci

      - name: Deploy Worker
        id: deploy
        if: steps.check-secrets.outputs.configured == 'true'
        working-directory: worker
        run: |
          set -o pipefail
          npx wrangler deploy | tee deploy-output.txt
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy-output.txt | head -1)
          if [ -z "$url" ]; then
            echo "::error::Could not find the deployed Worker's URL in wrangler's output."
            exit 1
          fi
          echo "worker_url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify the deployed Worker answers with a valid contract
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          url="${{ steps.deploy.outputs.worker_url }}/observations"
          echo "Checking $url"
          curl -sS -f "$url" -o response.json
          node -e '
            const data = JSON.parse(require("fs").readFileSync("response.json", "utf8"));
            if (!Array.isArray(data.observations)) {
              console.error("Response is missing an observations array:", data);
              process.exit(1);
            }
            console.log(`OK: ${data.observations.length} observations, stale=${data.stale}`);
          '

      - name: Skip (credentials not configured)
        if: steps.check-secrets.outputs.configured == 'false'
        run: |
          echo "::warning::Skipping Cloudflare Worker deploy — the CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repository secrets are not set. Add both under Settings > Secrets and variables > Actions to enable this workflow (see README.md)."
