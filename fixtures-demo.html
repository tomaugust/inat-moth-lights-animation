<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Phase 2 fixtures demo</title>
    <link rel="stylesheet" href="styles/main.css" />
    <style>
      .demo-status {
        background: rgba(10, 10, 12, 0.55);

        font-size: 0.78rem;
        left: 16px;
        line-height: 1.5;
        margin: 0;
        padding: 10px 14px;

        white-space: pre;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="canvas-shell" aria-label="Fixture-driven orbit animation">
        <canvas id="orbit-canvas"></canvas>
        <pre class="demo-status" id="demo-status">loading…</pre>
      </section>
    </main>

    <script type="module" src="src/fixtures-demo.js"></script>
