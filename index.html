<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moth Light Animation</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
        background: #101114;
        color: #f5f1e8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100vh;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #101114;
        color: #f5f1e8;
      }

      .app-shell {
        display: grid;
        gap: 24px;
        grid-template-columns: minmax(220px, 360px) minmax(320px, 1fr);
        max-width: 1200px;
        width: 100%;
      }

      .panel {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 20px;
      }

      .panel h1 {
        font-size: 1.7rem;
        margin: 0 0 12px;
      }

      .panel p {
        line-height: 1.5;
        margin: 0;
      }

      .canvas-shell {
        min-height: 580px;
      }

      canvas {
        display: block;
        width: 100%;
        min-height: 580px;
        height: 100%;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        background: radial-gradient(circle at center, #252018 0%, #111114 58%, #07080a 100%);
      }

      @media (max-width: 760px) {
        body {
          align-items: stretch;
          padding: 16px;
        }

        .app-shell {
          grid-template-columns: 1fr;
        }

        .canvas-shell,
        canvas {
          min-height: min(70vh, 520px);
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="panel" aria-label="Animation details">
        <h1>Moth Light Animation</h1>
        <p>A standalone animation generated from species and moth observations.</p>
      </section>
      <section class="canvas-shell" aria-label="Orbit animation">
        <canvas id="orbit-canvas"></canvas>
      </section>
    </main>

    <script>
      const config = {"moths":[{"size":13,"id":"moth-001","orbitStrokeColor":"","chimeNote":"E3","color":"#d7b46a","species":"large-yellow-underwing","speed":0.85,"label":"Large Yellow Underwing","trailLength":18,"angle":15,"erraticness":0.18,"shadowColor":"rgba(255, 224, 151, 0.24)","radius":230,"speciesName":"Large Yellow Underwing","shadowBlur":16},{"size":8,"id":"moth-002","orbitStrokeColor":"","chimeNote":"A4","color":"#b8c5d8","species":"silver-y","speed":1.35,"label":"Silver Y","trailLength":18,"angle":95,"erraticness":0.45,"shadowColor":"rgba(218, 235, 255, 0.2)","radius":0,"speciesName":"Silver Y","shadowBlur":12},{"size":6,"id":"moth-003","orbitStrokeColor":"","chimeNote":"C5","color":"#e2d56f","species":"brimstone-moth","speed":1.75,"label":"Brimstone Moth","trailLength":18,"angle":185,"erraticness":0.6,"shadowColor":"rgba(255, 244, 172, 0.2)","radius":0,"speciesName":"Brimstone Moth","shadowBlur":9},{"size":10,"id":"moth-004","orbitStrokeColor":"","chimeNote":"A4","color":"#b8c5d8","species":"silver-y","speed":1.1,"label":"Silver Y","trailLength":18,"angle":275,"erraticness":0.45,"shadowColor":"rgba(218, 235, 255, 0.2)","radius":0,"speciesName":"Silver Y","shadowBlur":12},{"size":13,"id":"moth-005","orbitStrokeColor":"","chimeNote":"E3","color":"#d7b46a","species":"large-yellow-underwing","speed":0.85,"label":"Large Yellow Underwing","trailLength":18,"angle":330,"erraticness":0.28,"shadowColor":"rgba(255, 224, 151, 0.24)","radius":180,"speciesName":"Large Yellow Underwing","shadowBlur":16}],"species":[{"erraticness":0.18,"id":"large-yellow-underwing","chimeNote":"E3","size":13,"speed":0.85,"orbitStrokeColor":"","color":"#d7b46a","name":"Large Yellow Underwing","shadowBlur":16,"shadowColor":"rgba(255, 224, 151, 0.24)","trailLength":18},{"erraticness":0.45,"id":"silver-y","chimeNote":"A4","size":8,"speed":1.35,"orbitStrokeColor":"","color":"#b8c5d8","name":"Silver Y","shadowBlur":12,"shadowColor":"rgba(218, 235, 255, 0.2)","trailLength":18},{"erraticness":0.6,"id":"brimstone-moth","chimeNote":"C5","size":6,"speed":1.75,"orbitStrokeColor":"","color":"#e2d56f","name":"Brimstone Moth","shadowBlur":9,"shadowColor":"rgba(255, 244, 172, 0.2)","trailLength":18}],"centerDot":{"color":"#fff4bc","glowColor":"rgba(255, 232, 142, 0.6)","size":18,"shadowBlur":28},"animation":{"canvasBorderColor":"rgba(255, 255, 255, 0.16)","description":"A standalone animation generated from species and moth observations.","textColor":"#f5f1e8","panelBorderColor":"rgba(255, 255, 255, 0.12)","orbitStrokeColor":"rgba(255, 244, 201, 0.1)","title":"Moth Light Animation","panelBackground":"rgba(255, 255, 255, 0.07)","canvasBackground":"radial-gradient(circle at center, #252018 0%, #111114 58%, #07080a 100%)","backgroundColor":"#101114"}};

      function createMoths(config, width, height) {
        const maxMothSize = config.moths.reduce((largest, moth) => Math.max(largest, moth.size), 0);
        const usableRadius = Math.max(32, Math.min(width, height) * 0.5 - maxMothSize - 18);
        const minRadius = Math.min(72, usableRadius);
        const autoStep = config.moths.length > 1 ? Math.max(0, (usableRadius - minRadius) / (config.moths.length - 1)) : 0;

        return config.moths.map((moth, index) => ({
          angle: (moth.angle * Math.PI) / 180,
          chimeNote: moth.chimeNote,
          color: moth.color,
          erraticness: moth.erraticness,
          id: moth.id,
          label: moth.label,
          orbitStrokeColor: moth.orbitStrokeColor || config.animation.orbitStrokeColor,
          radius: moth.radius > 0 ? Math.min(moth.radius, usableRadius) : Math.min(usableRadius, minRadius + index * autoStep),
          shadowBlur: moth.shadowBlur,
          shadowColor: moth.shadowColor,
          size: moth.size,
          species: moth.species,
          speciesName: moth.speciesName,
          speed: moth.speed,
          trailLength: moth.trailLength
        }));
      }

      function drawScene(context, moths, width, height, elapsed) {
        context.clearRect(0, 0, width, height);

        const cx = width / 2;
        const cy = height / 2;

        context.save();
        context.fillStyle = config.centerDot.color;
        context.shadowColor = config.centerDot.glowColor;
        context.shadowBlur = config.centerDot.shadowBlur;
        context.beginPath();
        context.arc(cx, cy, config.centerDot.size, 0, Math.PI * 2);
        context.fill();
        context.restore();

        moths.forEach((moth) => {
          const angle = moth.angle + elapsed * moth.speed * 0.001;
          const x = cx + Math.cos(angle) * moth.radius;
          const y = cy + Math.sin(angle) * moth.radius;

          context.save();
          context.strokeStyle = moth.orbitStrokeColor;
          context.lineWidth = 1;
          context.beginPath();
          context.arc(cx, cy, moth.radius, 0, Math.PI * 2);
          context.stroke();
          context.restore();

          context.save();
          context.fillStyle = moth.color;
          context.shadowColor = moth.shadowColor;
          context.shadowBlur = moth.shadowBlur;
          context.beginPath();
          context.arc(x, y, moth.size, 0, Math.PI * 2);
          context.fill();
          context.restore();
        });
      }

      function setupOrbitAnimation() {
        const canvas = document.getElementById("orbit-canvas");
        const context = canvas.getContext("2d");
        let moths = [];

        function resizeCanvas() {
          const rect = canvas.getBoundingClientRect();
          const scale = window.devicePixelRatio || 1;
          canvas.width = Math.max(1, Math.floor(rect.width * scale));
          canvas.height = Math.max(1, Math.floor(rect.height * scale));
          context.setTransform(scale, 0, 0, scale, 0, 0);
          moths = createMoths(config, rect.width, rect.height);
        }

        function tick(timestamp) {
          drawScene(context, moths, canvas.clientWidth, canvas.clientHeight, timestamp);
          requestAnimationFrame(tick);
        }

        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();
        requestAnimationFrame(tick);
      }

      setupOrbitAnimation();
    </script>
  </body>
</html>
