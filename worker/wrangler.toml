name = "inat-moth-lights-adapter"
main = "src/index.js"
compatibility_date = "2024-01-01"

# CORS origins allowed to call this adapter, comma-separated. Update
# ALLOWED_ORIGINS if the production site moves to a custom domain, and add
# whatever local dev port you actually use.
[vars]
ALLOWED_ORIGINS = "https://tomaugust.github.io,http://localhost:8080"
TAXON_ID = "47157"
# iNaturalist place_id 6857 = United Kingdom (admin_level 0).
PLACE_ID = "6857"
# caches.default is a per-Cloudflare-datacenter cache, not one global cache —
# actual upstream request volume is roughly (this many requests per
# CACHE_SECONDS) PER COLO receiving traffic, not one total. 300s keeps the
# realistic worst case (traffic spread across several colos) well under
# iNaturalist's ~1 req/s recommended ceiling; see worker/src/index.js.
PAGE_SIZE = "200"
CACHE_SECONDS = "300"
UPSTREAM_TIMEOUT_MS = "15000"
